name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      # Missing translations and changed {placeholders}, named line by line.
      - run: npm run i18n:check
      - run: npx vite build --outDir "$RUNNER_TEMP/build"

  # qbminimal against a real qBittorrent: the official container serves the built app as its
  # alternative Web UI, and a script checks the page and the Web API calls the app depends on.
  qbittorrent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run release
      - name: Start qBittorrent with qbminimal
        run: |
          profile="$RUNNER_TEMP/qbt"
          mkdir -p "$profile/qBittorrent/config" "$profile/downloads"
          # Local requests need no sign-in, and the Web UI is qbminimal from release/public.
          cat > "$profile/qBittorrent/config/qBittorrent.conf" <<'CONF'
          [LegalNotice]
          Accepted=true

          [Preferences]
          WebUI\LocalHostAuth=false
          WebUI\Port=8080
          WebUI\AlternativeUIEnabled=true
          WebUI\RootFolder=/qbminimal
          CONF
          docker run -d --name qbt --network host \
            -e QBT_LEGAL_NOTICE=confirm -e QBT_WEBUI_PORT=8080 -e PUID="$(id -u)" -e PGID="$(id -g)" \
            -v "$profile:/config" -v "$GITHUB_WORKSPACE/release:/qbminimal:ro" \
            qbittorrentofficial/qbittorrent-nox:latest
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/api/v2/app/version && break
            sleep 2
          done
      # The update test installs the latest release from a torrent built here, from the same files and
      # web seed as the release's own, so CI runs don't add to the release's download counts.
      - name: Build the latest release's update torrent
        run: |
          version="$(curl -s -o /dev/null -w '%{redirect_url}' "https://github.com/$GITHUB_REPOSITORY/releases/latest" | sed 's|.*/tag/v||')"
          git fetch -q --depth 1 origin updates
          mkdir -p "$RUNNER_TEMP/update"
          git archive FETCH_HEAD "$version" | tar -x -C "$RUNNER_TEMP/update"
          node scripts/make-update-torrent.mjs "$RUNNER_TEMP/update/$version/qbminimal-$version" "qbminimal-$version" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/updates/$version/" "$RUNNER_TEMP/update.torrent"
          echo "QBT_UPDATE_VERSION=$version" >> "$GITHUB_ENV"
          echo "QBT_UPDATE_TORRENT=$RUNNER_TEMP/update.torrent" >> "$GITHUB_ENV"
      - name: Check qbminimal against qBittorrent
        # The update test downloads into the profile's downloads folder, seen here as well.
        env:
          QBT_DOWNLOADS: /config/downloads
          QBT_DOWNLOADS_HOST: ${{ runner.temp }}/qbt/downloads
        run: |
          # If the container still asks for a password, it prints a temporary one for admin.
          password="$(docker logs qbt 2>&1 | sed -n 's/.*temporary password is provided for this session: //p' | tail -1)"
          if curl -sf http://127.0.0.1:8080/api/v2/app/version > /dev/null; then
            node scripts/qbittorrent-smoke.mjs http://127.0.0.1:8080
          else
            node scripts/qbittorrent-smoke.mjs http://127.0.0.1:8080 admin "$password"
          fi
      - name: qBittorrent's log
        if: failure()
        run: docker logs qbt 2>&1 | tail -50
